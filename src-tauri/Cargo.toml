[package]
name = "wt-content-manager"
version = "0.12.3"
description = "Desktop catalog and installer for War Thunder community content"
authors = []
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "wt_content_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", features = ["form", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "time"] }
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
